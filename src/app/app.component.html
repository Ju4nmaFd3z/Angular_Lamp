<div class="cabecera">
  <h1>Mi lámpara en Angular</h1>
  <div class="estado">
    @if (this.enchufado) {
    <span>La lámpara está enchufada</span>
    } @else {
    <span>La lámpara no está enchufada</span>
    }
  </div>
  <div>
    <span> {{'Último estado recibido:' + this.estadoLampara }} </span>
  </div>
  <div class="boton">
    @if (this.enchufado) {
    <button (click)="onClickDesenchufar()">DESENCHUFAR</button>
    } @else {
    <button (click)="onClickEnchufar()">ENCHUFAR</button>
    }
  </div>
</div>
<app-lampara
  [enchufada]="this.enchufado"
  (estadoLampara)="onCambioEstadoLampara($event)"></app-lampara>
